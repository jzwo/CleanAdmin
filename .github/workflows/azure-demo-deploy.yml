name: Build and deploy ASP.Net Core app to an Azure Web App

env:
  AZURE_WEBAPP_NAME: CleanAdmin   # set this to your application's name
  AZURE_WEBAPP_PACKAGE_PATH: './src/CleanAdmin.Web'      # set this to the path to your web app project, defaults to the repository root
  DOTNET_VERSION: '10.0'                 # set this to the .NET Core version to use

on:
  push:
    branches:
      - master
      - deploy-test
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend dependencies
        run: npm ci
        working-directory: ./src/CleanAdmin.Web

      - name: Set up dependency caching for faster builds
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Build with dotnet
        run: dotnet build --configuration Release

      - name: dotnet publish
        run: dotnet publish ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}/CleanAdmin.Web.csproj -c Release -o ${{env.DOTNET_ROOT}}/myapp

      - name: Remove extra runtimeconfig files
        run: |
          find ${{env.DOTNET_ROOT}}/myapp -type f -name "*.runtimeconfig.json" ! -name "CleanAdmin.Web.runtimeconfig.json" -delete
          find ${{env.DOTNET_ROOT}}/myapp -type f -name "*.runtimeconfig.dev.json" -delete

      - name: Verify runtimeconfig files in artifact
        run: find ${{env.DOTNET_ROOT}}/myapp -type f -name "*.runtimeconfig*.json" -print

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{env.DOTNET_ROOT}}/myapp

  deploy:
    runs-on: ubuntu-latest
    needs: build
    env:
      AZURE_WEBAPP_PUBLISH_PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v5
        with:
          name: .net-app

      - name: Clean remote wwwroot before deploy
        shell: pwsh
        run: |
          [xml]$publishProfile = $env:AZURE_WEBAPP_PUBLISH_PROFILE
          $msDeployProfile = $publishProfile.publishData.publishProfile | Where-Object { $_.publishMethod -eq 'MSDeploy' } | Select-Object -First 1

          if (-not $msDeployProfile) {
            throw "MSDeploy profile not found in publish profile secret."
          }

          $kuduHost = ($msDeployProfile.publishUrl -split ':')[0]
          $kuduUrl = "https://$kuduHost/api/command"
          $securePassword = ConvertTo-SecureString $msDeployProfile.userPWD -AsPlainText -Force
          $credential = New-Object System.Management.Automation.PSCredential($msDeployProfile.userName, $securePassword)

          $cleanupCommand = "powershell -NoProfile -NonInteractive -Command \"if (Test-Path 'D:\\home\\site\\wwwroot') { Get-ChildItem 'D:\\home\\site\\wwwroot' -Force | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue }\""
          $body = @{ command = $cleanupCommand; dir = 'D:\home\site\wwwroot' } | ConvertTo-Json

          Invoke-RestMethod -Method Post -Uri $kuduUrl -Credential $credential -Authentication Basic -ContentType 'application/json' -Body $body

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: .
